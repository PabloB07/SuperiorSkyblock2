title: '&lContadores de bloques de la isla'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ $ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

items:
  '@':
    type: STONE
    name: '&e{0}'
    lore:
      - '&6&l* &e&lCantidad &fx{1}'
      - '&6&l* &e&lValor: &f${2}'
      - '&6&l* &e&lNivel: &f${3}'
    flags:
      - HIDE_ADDITIONAL_TOOLTIP
  '%':
    type: PAPER
    name: '{0}Página anterior'
  '*':
    type: SUNFLOWER
    name: '&aPágina actual'
    lore:
      - '&7Página {0}'
  '^':
    type: PAPER
    name: '{0}Página siguiente'
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
