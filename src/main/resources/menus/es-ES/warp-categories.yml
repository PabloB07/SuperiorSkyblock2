    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
  '%':
    type: PAPER
    name: '&cPágina anterior'
  '*':
    type: SUNFLOWER
    name: '&aPágina actual'
    lore:
      - '&7Página 1'
  '^':
    type: PAPER
    name: '&cPágina siguiente'
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
