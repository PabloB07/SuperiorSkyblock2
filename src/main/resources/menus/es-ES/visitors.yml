title: '&lVisitantes de la isla ({0})'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ ~ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'
unique-visitors: '~'

items:
  '@':
    type: PLAYER_HEAD
    name: '&e{0}'
    lore:
      - '&7Dueño de la isla: {1}'
      - ''
      - '&7Clic izquierdo para expulsar al jugador.'
      - '&7Clic derecho para invitar al jugador.'
  '%':
    type: PAPER
    name: '{0}Página anterior'
  '*':
    type: SUNFLOWER
    name: '&aPágina actual'
    lore:
      - '&7Página {0}'
  '^':
    type: PAPER
    name: '{0}Página siguiente'
  '~':
    type: SKELETON_SKULL
    name: '&eVisitantes únicos'
    lore:
      - '&7Haz clic para ver el menú de visitantes históricos.'
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'

sounds:
  '@':
    type: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.2
    pitch: 0.2
